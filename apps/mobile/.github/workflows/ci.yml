name: CI — Lint, Typecheck, Test, EAS Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

  # Building an actual installable binary for a React Native/Expo app is done
  # through EAS Build, not a raw `gradle assembleRelease` step — Expo's
  # managed workflow doesn't check native android/ios projects into the repo.
  # This job is disabled by default (needs EXPO_TOKEN in repo secrets) since
  # it consumes EAS Build credits/minutes; enable by removing the `if: false`
  # once an Expo account + eas.json profile are set up.
  eas-build-android:
    name: EAS Build (Android)
    runs-on: ubuntu-latest
    needs: quality
    if: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android (EAS)
        run: eas build --platform android --non-interactive --profile preview
