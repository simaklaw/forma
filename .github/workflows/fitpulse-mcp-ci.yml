name: FitPulse MCP CI

on:
  pull_request:
    paths:
      - "tools/fitpulse-mcp/**"
      - ".github/workflows/fitpulse-mcp-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/fitpulse-mcp/package.json
      - name: Install dependencies
        working-directory: tools/fitpulse-mcp
        run: npm install
      - name: Type-check Worker
        working-directory: tools/fitpulse-mcp
        run: npm run typecheck
