name: Sync Verified FitPulse Animation Media

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-fitpulse-animation-media.yml"
      - ".github/scripts/sync-fitpulse-animation-media.py"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-fitpulse-animation-media
  cancel-in-progress: false

jobs:
  sync-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Download, verify and stage published media
        run: python3 .github/scripts/sync-fitpulse-animation-media.py

      - name: Open or update a PR containing the verified app assets
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/sync-fitpulse-exercise-media
          delete-branch: false
          title: "chore(assets): sync verified FitPulse exercise animations"
          commit-message: "chore(assets): sync verified FitPulse exercise animations"
          body: |
            Automated asset sync from the public FitPulse Animation Studio manifests.

            The workflow verifies source repository and exercise identity, expected video dimensions/frame rate/frame counts, SHA-256 and byte length for every video, PNG poster signatures, and gender-specific outputs before staging them. It preserves source motion/apparel attribution in fitpulse-animation-manifest.json and creates mobile asset symlinks to the public files.

            This PR contains only generated exercise media and their manifest. It does not change workout logic, timers, history, buttons, or navigation.
