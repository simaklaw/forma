name: Sync Verified FitPulse Animation Media

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-fitpulse-animation-media.yml"
      - ".github/scripts/sync-fitpulse-animation-media.py"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-fitpulse-animation-media
  cancel-in-progress: false

jobs:
  sync-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Ensure ffprobe is available
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          ffprobe -version | head -n 1

      - name: Download, verify and stage published media
        run: python3 .github/scripts/sync-fitpulse-animation-media.py

      - name: Open or update a PR containing the verified app assets
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/sync-fitpulse-exercise-media
          delete-branch: false
          title: "chore(assets): sync verified FitPulse exercise animations"
          commit-message: "chore(assets): sync verified FitPulse exercise animations"
          body: |
            Automated asset sync from the public FitPulse Animation Studio manifests.

            The workflow verifies source repository and exercise identity, compares publisher metadata with decoded MP4 width, height, frame rate and frame count using ffprobe, checks SHA-256 and byte length for every video, validates PNG poster signatures, and stages gender-specific outputs only after all checks pass. It preserves source motion/apparel attribution in fitpulse-animation-manifest.json and creates mobile asset symlinks to the public files.

            This PR contains only generated exercise media and their manifest. It does not change workout logic, timers, history, buttons, or navigation.
