name: Import uploaded forma feature bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-forma-zip.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import feature branch from ZIP bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="For forma1.zip"
          branch="feat/dataset-instructions-local-media"
          tmp="$(mktemp -d)"
          unzip -q "$archive" -d "$tmp"
          bundle="$tmp/feat-dataset-instructions-local-media.bundle"
          git bundle verify "$bundle"
          # The bundle exposes the feature commit as HEAD (not as a named branch).
          git fetch "$bundle" HEAD:refs/heads/"$branch"
          git checkout "$branch"
          # Reconcile the artifact with the current main branch before publishing.
          git merge --no-edit origin/main
          git push origin "$branch"
          echo "Published branch: $branch"
          git log -1 --format='HEAD: %H%n%s'
