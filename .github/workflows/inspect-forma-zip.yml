name: Inspect uploaded forma ZIP

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-forma-zip.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect archive and git artifacts
        shell: bash
        run: |
          set -euo pipefail
          archive="For forma1.zip"
          test -f "$archive"
          tmp="$(mktemp -d)"
          unzip -q "$archive" -d "$tmp"
          echo "=== ZIP entries ==="
          unzip -Z1 "$archive"
          echo "=== Bundle verification ==="
          git bundle verify "$tmp/feat-dataset-instructions-local-media.bundle"
          echo "=== Bundle refs ==="
          git bundle list-heads "$tmp/feat-dataset-instructions-local-media.bundle"
          echo "=== Bundle branch commit ==="
          git fetch "$tmp/feat-dataset-instructions-local-media.bundle" feat/dataset-instructions-local-media:refs/remotes/import/feat-dataset-instructions-local-media
          git log -1 --format='%H%n%P%n%s%n%ci' refs/remotes/import/feat-dataset-instructions-local-media
          echo "=== Patch summary ==="
          git apply --stat "$tmp/feat-dataset-instructions-code-only.patch"
          echo "=== Patch paths ==="
          git apply --numstat "$tmp/feat-dataset-instructions-code-only.patch"
