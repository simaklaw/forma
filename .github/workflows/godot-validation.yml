name: Godot Project Validation

on:
  pull_request:
    paths:
      - "tools/godot-studio/**"
      - ".github/workflows/godot-validation.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for validation
        required: false
        default: Manual validation
  repository_dispatch:
    types: [fitpulse_godot_validate]

permissions:
  contents: read

concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          VERSION="4.5"
          curl -fsSL "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v${VERSION}-stable_linux.x86_64
          ln -sf "/tmp/godot/Godot_v${VERSION}-stable_linux.x86_64" /tmp/godot/godot

      - name: Validate Godot project
        shell: bash
        run: |
          set -euo pipefail
          test -f "tools/godot-studio/project.godot"
          /tmp/godot/godot --headless --path tools/godot-studio --editor --quit --verbose
          echo "Godot headless project import completed."
