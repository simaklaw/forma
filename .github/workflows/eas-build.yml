name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform
        required: true
        type: choice
        options:
          - android
          - ios
          - all
        default: android
      profile:
        description: EAS build profile
        required: true
        type: choice
        options:
          - development
          - preview
          - production
        default: development

concurrency:
  group: eas-build-${{ inputs.platform }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    name: EAS ${{ inputs.platform }} · ${{ inputs.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Repo secret is EXPO_TOKEN_FITPULSE; EAS CLI reads EXPO_TOKEN.
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN_FITPULSE }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Validate Expo configuration
        run: pnpm exec expo config --type public --json > /tmp/expo-config.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: pnpm

      - name: Build native application
        run: eas build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --non-interactive
