name: Monorepo CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install · Type-check · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup pnpm
        run: npm install --global pnpm@9.15.0

      - name: Cache pnpm
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check diff whitespace
        run: git diff --check

      - name: Build web
        run: pnpm --filter @forma/web build

      - name: Type-check all packages
        run: pnpm type-check

      - name: Test shared core
        run: pnpm --filter @forma/core test

      - name: Test workout domain
        run: pnpm --filter @forma/workout-domain test

      - name: Test mobile
        run: pnpm --filter @forma/mobile test -- --ci --passWithNoTests

      - name: Test web domain helpers
        run: pnpm --filter @forma/web test
