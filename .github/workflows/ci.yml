name: Monorepo CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install · Type-check · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check diff whitespace
        run: git diff --check

      - name: Setup Python for exercise asset tooling
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test original exercise frame converter
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python -m unittest discover -s scripts/tests -v

      # Progressive Prettier gate — expand as packages are formatted.
      - name: Check formatting (gate paths)
        run: pnpm exec prettier --version && pnpm format:check:gate

      # Advisory lint (ревью-находка #4): правила в warn — подсвечиваем, не блокируем.
      # Фаза 2 линта (#4): warn остаётся advisory (сигнал в логах/отчёте),
      # error — блокирует CI. Правила переводятся в error по мере чистки
      # кода (см. eslint.config.mjs, ERROR_RULES).
      - name: Lint (warn advisory, error blocking)
        run: |
          set +e
          pnpm --filter @forma/api --filter @forma/web --filter @forma/core --filter @forma/sync-contract --filter @forma/workout-domain lint 2>&1 | tee lint.log
          code=${PIPESTATUS[0]}
          echo "lint exit code: $code (0=чисто; warnings advisory; errors блокируют)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 1 ]; then
            echo "## ESLint errors found — CI failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$code" -gt 1 ]; then
            echo "ESLint crashed with exit $code" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          exit 0

      - name: Build web
        run: pnpm --filter @forma/web build

      - name: Type-check core packages
        run: |
          set -o pipefail
          pnpm --filter @forma/core --filter @forma/workout-domain --filter @forma/mobile --filter @forma/web type-check 2>&1
 | tee typecheck_core.log

      - name: Type-check P1 packages
        run: pnpm --filter @forma/sync-contract --filter @forma/api type-check

      - name: Test shared core
        run: pnpm --filter @forma/core test

      - name: Test workout domain
        run: pnpm --filter @forma/workout-domain test

      - name: Test sync-contract
        run: pnpm --filter @forma/sync-contract test

      - name: Test api
        run: |
          set -o pipefail
          pnpm --filter @forma/api test 2>&1 | tee api_test.log

      - name: Test mobile
        run: |
          set -o pipefail
          pnpm --filter @forma/mobile test -- --ci --passWithNoTests 2>&1 | tee mobile_test.log

      - name: Test web domain helpers
        run: pnpm --filter @forma/web test

      # Фаза 2 линта (#4): advisory-отчёт всегда доступен для анализа —
      # публикуем в ci-logs/lint-report (каталог перезаписывается, история
      # не копится), только если есть ворнинги и ран same-repo.
      - name: Publish lint report (ci-logs)
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.id == github.repository.id)
        run: |
          set +e
          [ -f lint.log ] || exit 0
          grep -q "warning" lint.log || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch origin ci-logs || true
          git checkout -B ci-logs origin/ci-logs 2>/dev/null || git checkout -B ci-logs
          mkdir -p ci-logs/lint-report
          cp lint.log ci-logs/lint-report/lint.log
          echo "lint report updated $(date -u +%FT%TZ) run ${{ github.run_id }} commit ${{ github.sha }}" > ci-logs/lint-report/README.txt
          git add -f ci-logs/lint-report
          git commit -m "ci: lint report update (run ${{ github.run_id }})" || exit 0
          git push --force origin ci-logs

      - name: Publish diagnostics on failure
        # Ревью #9: в ветку ci-logs пишем только из same-repo ранов —
        # у fork-PR токен read-only: шаг молча падал и краснил CI контрибьютору.
        if: failure() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.id == github.repository.id)
        run: |
          set +e
          SAY() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          SAY "## CI failure diagnostics (run ${{ github.run_id }})"
          if [ -f mobile_test.log ]; then
            SAY "### mobile_test.log"
            SAY "```"
            tail -c 16000 mobile_test.log >> "$GITHUB_STEP_SUMMARY"
            SAY "```"
          fi
          if [ -f api_test.log ]; then
            SAY "### api_test.log"
            SAY "```"
            tail -c 12000 api_test.log >> "$GITHUB_STEP_SUMMARY"
            SAY "```"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch origin ci-logs && SAY "fetch ok" || SAY "fetch fail"
          
git checkout -B ci-logs origin/ci-logs 2>/dev/null || git checkout -B ci-logs
          SAY "branch=$(git branch --show-current)"
          DIR="ci-logs/${{ github.run_id }}"
          mkdir -p "$DIR"
          for f in api_test.log typecheck_core.log mobile_test.log lint.log; do [ -f "$f" ] && cp "$f" "$DIR/"; done
          echo "ci failed run: ${{ github.run_id }} commit ${{ github.sha }} date $(date -u +%FT%TZ)" >> "$DIR/README.txt"
          git add -f ci-logs && SAY "add ok" || SAY "add fail"
          git commit -m "ci: diagnostics from failed ci run ${{ github.run_id }}" && SAY "commit ok" || SAY "commit fail: $(git status --short | head -5)"
          git push --force origin ci-logs 2>&1 | tail -3 >> "$GITHUB_STEP_SUMMARY"
          exit 0
