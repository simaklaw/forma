name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        id: pnpm
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          # cache: gradle intentionally omitted — android/ does not exist until
          # expo prebuild runs later. setup-java fails hard when no gradle files
          # match (it does not degrade to a cache miss).

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          echo "pnpm_home=${PNPM_HOME:-unset}"
          command -v pnpm
          pnpm --version
          java -version

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Generate Android project
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          # Plain standalone APK (not a development client). Keep expo-dev-client
          # in package.json for EAS development builds, but do not autolink it
          # here: Expo SDK 51 otherwise adds a broken expo-dev-launcher
          # includeBuild(null) under pnpm.
          sed -i '/"expo-dev-client":/d' package.json
          pnpm exec expo prebuild --platform android --clean
          # Expo SDK 51 template resolves this package from the current directory.
          # With pnpm, resolve through react-native instead; otherwise the empty
          # result becomes includeBuild("null").
          sed -i "s#require.resolve('@react-native/gradle-plugin/package.json')#require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })#" android/settings.gradle
          # Confirm config plugin applied (must survive prebuild --clean).
          grep -q 'debuggableVariants = \[\]' android/app/build.gradle \
            || { echo '::error::withDebugBundle plugin did not set debuggableVariants = []'; exit 1; }

      - name: Pre-bundle JS into Android assets
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          # Belt-and-suspenders for monorepo: ensure index.android.bundle exists
          # even if createBundle*JsAndAssets is skipped or misconfigured.
          mkdir -p android/app/src/main/assets
          NODE_ENV=production pnpm exec react-native bundle \
            --platform android \
            --dev false \
            --minify true \
            --entry-file node_modules/expo/AppEntry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
          test -s android/app/src/main/assets/index.android.bundle
          ls -lh android/app/src/main/assets/index.android.bundle

      - name: Build standalone release APK
        working-directory: apps/mobile/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate APK and verify JS bundle inside
        shell: bash
        run: |
          set -euo pipefail
          echo "Найденные APK:"
          find apps/mobile/android -type f -name '*.apk' -print
          APK="$(find apps/mobile/android -type f -name '*.apk' -print | head -n 1)"
          test -n "$APK" || { echo '::error::Ни одного .apk не найдено'; exit 1; }
          echo "Checking bundle inside: $APK"
          unzip -l "$APK" | tee /tmp/apk-list.txt
          grep -E 'assets/index\.android\.bundle|index\.android\.bundle' /tmp/apk-list.txt \
            || { echo '::error::APK does not contain index.android.bundle — Metro-less install will crash'; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: forma-android-standalone-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 5
