name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK (preinstalled on GitHub runners)
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          # cmdline-tools path differs by image version
          for d in latest 16.0 13.0 12.0; do
            if [[ -d "$ANDROID_HOME/cmdline-tools/$d/bin" ]]; then
              echo "$ANDROID_HOME/cmdline-tools/$d/bin" >> "$GITHUB_PATH"
              export PATH="$ANDROID_HOME/cmdline-tools/$d/bin:$PATH"
              break
            fi
          done

          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME" || true

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.1.8937393" \
            "cmake;3.22.1" || true

      - name: Install workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Generate Android project (expo prebuild)
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '"expo-dev-client"' package.json; then
            sed -i '/"expo-dev-client":/d' package.json
          fi
          pnpm exec expo prebuild --platform android --clean --no-install

          if [[ -f android/settings.gradle ]]; then
            sed -i "s#require.resolve('@react-native/gradle-plugin/package.json')#require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })#" android/settings.gradle || true
            echo "--- settings.gradle (head) ---"
            head -40 android/settings.gradle
          fi

          if [[ ! -f index.js ]]; then
            echo "::error::apps/mobile/index.js missing"
            exit 1
          fi

      - name: Prefetch SQLite amalgamation
        shell: bash
        run: |
          set -euo pipefail
          ZIP_URL="https://www.sqlite.org/2024/sqlite-amalgamation-3450300.zip"
          DEST="$RUNNER_TEMP/sqlite-amalgamation-3450300.zip"
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 5 --retry-delay 3 -o "$DEST" "$ZIP_URL"; then
              echo "SQLite zip OK (attempt $i)"
              # Place where gradle-download-task / expo-sqlite often look
              mkdir -p "$HOME/.gradle/caches/modules-2/files-2.1"
              break
            fi
            echo "SQLite download attempt $i failed"
            sleep 3
          done
          ls -la "$DEST" 2>/dev/null || echo "::warning::SQLite prefetch failed; Gradle will retry"

      - name: Build debug APK
        working-directory: apps/mobile/android
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "JAVA_HOME=${JAVA_HOME:-}"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail
          echo "Найденные APK:"
          find apps/mobile/android -type f -name '*.apk' -print
          test -n "$(find apps/mobile/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)" \
            || { echo '::error::Ни одного .apk не найдено'; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fitpulse-android-debug-apk
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/*.apk
            apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
