name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Install workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Generate Android project (expo prebuild)
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          # Plain standalone APK — strip expo-dev-client so Expo does not
          # inject a broken expo-dev-launcher includeBuild under pnpm.
          if grep -q '"expo-dev-client"' package.json; then
            sed -i '/"expo-dev-client":/d' package.json
          fi
          pnpm exec expo prebuild --platform android --clean --no-install

          # Safety net: pnpm can still leave includeBuild(null) if the
          # config plugin did not rewrite settings.gradle.
          if [[ -f android/settings.gradle ]]; then
            sed -i "s#require.resolve('@react-native/gradle-plugin/package.json')#require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })#" android/settings.gradle || true
            echo "--- settings.gradle (head) ---"
            head -40 android/settings.gradle
          fi

          if [[ ! -f index.js ]]; then
            echo "::error::apps/mobile/index.js missing (monorepo entry)"
            exit 1
          fi

      - name: Prefetch SQLite amalgamation (avoid flaky network mid-build)
        shell: bash
        run: |
          set -euo pipefail
          # expo-sqlite downloads this during :expo-sqlite:downloadSQLite
          mkdir -p "$HOME/.gradle/caches"
          ZIP_URL="https://www.sqlite.org/2024/sqlite-amalgamation-3450300.zip"
          DEST="$RUNNER_TEMP/sqlite-amalgamation-3450300.zip"
          for i in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 5 -o "$DEST" "$ZIP_URL"; then
              echo "SQLite zip OK ($i)"
              break
            fi
            echo "SQLite download attempt $i failed"
            sleep 5
          done
          # Best-effort cache into gradle download area if layout is known later
          ls -la "$DEST" || echo "::warning::SQLite prefetch failed; Gradle will retry"

      - name: Build debug APK (signed, installable without keystore secrets)
        working-directory: apps/mobile/android
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "JAVA_HOME=${JAVA_HOME:-}"
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail
          echo "Найденные APK:"
          find apps/mobile/android -type f -name '*.apk' -print
          test -n "$(find apps/mobile/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)" \
            || { echo '::error::Ни одного .apk не найдено'; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fitpulse-android-debug-apk
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/*.apk
            apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
