name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        id: pnpm
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          # cache: gradle intentionally omitted — android/ does not exist until
          # expo prebuild runs later. setup-java fails hard when no gradle files
          # match (it does not degrade to a cache miss).

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          echo "pnpm_home=${PNPM_HOME:-unset}"
          command -v pnpm
          pnpm --version
          java -version

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Generate Android project
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          # This workflow produces a plain debug APK, not a development
          # client. Keep expo-dev-client for EAS development builds, but do
          # not autolink it here: Expo SDK 51 otherwise adds a broken
          # expo-dev-launcher includeBuild(null) under pnpm.
          sed -i '/"expo-dev-client":/d' package.json
          pnpm exec expo prebuild --platform android --clean
          # Expo SDK 51's template resolves this package from the current
          # directory. With pnpm, resolve it through react-native instead;
          # otherwise the empty result becomes includeBuild("null").
          sed -i "s#require.resolve('@react-native/gradle-plugin/package.json')#require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })#" android/settings.gradle

      - name: Build debug APK (for testing)
        working-directory: apps/mobile/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail
          echo "Найденные APK:"
          find apps/mobile/android -type f -name '*.apk' -print
          test -n "$(find apps/mobile/android -type f -name '*.apk' -print -quit)" \
            || { echo '::error::Ни одного .apk не найдено под apps/mobile/android'; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: forma-android-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 5
