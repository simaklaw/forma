name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sync_api_url:
        description: "HTTPS sync API URL for this test APK"
        required: false
        default: "https://8787-i3mhfw1s8tu1g7pz6uw6e-a7c0b6ca.us3.manus.computer"
      mailru_client_id:
        description: "Public Mail.ru OIDC client ID"
        required: false
        default: "01a0f7166d967e68a13e38353948a6a5"

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      EXPO_PUBLIC_OIDC_MAILRU_CLIENT_ID: ${{ inputs.mailru_client_id || vars.EXPO_PUBLIC_OIDC_MAILRU_CLIENT_ID || '01a0f7166d967e68a13e38353948a6a5' }}
      EXPO_PUBLIC_SYNC_API_URL: ${{ inputs.sync_api_url || vars.EXPO_PUBLIC_SYNC_API_URL || 'https://8787-i3mhfw1s8tu1g7pz6uw6e-a7c0b6ca.us3.manus.computer' }}
      GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK (preinstalled on GitHub runners)
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          for d in latest 16.0 13.0 12.0; do
            if [[ -d "$ANDROID_HOME/cmdline-tools/$d/bin" ]]; then
              echo "$ANDROID_HOME/cmdline-tools/$d/bin" >> "$GITHUB_PATH"
              export PATH="$ANDROID_HOME/cmdline-tools/$d/bin:$PATH"
              break
            fi
          done

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;25.1.8937393" \
            "cmake;3.22.1" || true

      - name: Validate production app configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_PUBLIC_OIDC_MAILRU_CLIENT_ID" || { echo "::error::Missing GitHub Variable EXPO_PUBLIC_OIDC_MAILRU_CLIENT_ID"; exit 1; }
          test -n "$EXPO_PUBLIC_SYNC_API_URL" || { echo "::error::Missing GitHub Variable EXPO_PUBLIC_SYNC_API_URL"; exit 1; }
          case "$EXPO_PUBLIC_SYNC_API_URL" in https://*) ;; *) echo "::error::EXPO_PUBLIC_SYNC_API_URL must use HTTPS"; exit 1;; esac
          echo "Production Mail.ru client ID and HTTPS API URL are configured."

      - name: Install workspace dependencies (incl. devDeps for Babel/Metro)
        shell: bash
        env:
          NODE_ENV: development
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          node -e "require.resolve('babel-plugin-module-resolver')"
          echo "babel-plugin-module-resolver OK"

      - name: Materialize exercise media (no symlinks into APK)
        shell: bash
        run: |
          set -euo pipefail
          DEST="apps/mobile/assets/exercises"
          SRC="apps/web/public/exercises"
          mkdir -p "$DEST"
          for f in "$SRC"/*.{mp4,jpg}; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            rm -f "$DEST/$base"
            cp "$f" "$DEST/$base"
            echo "materialized $base ($(wc -c < "$DEST/$base") bytes)"
          done
          left=$(find "$DEST" -type l | wc -l | tr -d ' ')
          if [[ "$left" != "0" ]]; then
            echo "::error::$left symlinks remain under $DEST"
            find "$DEST" -type l
            exit 1
          fi
          ls -la "$DEST"

      - name: Generate Android project (expo prebuild)
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '"expo-dev-client"' package.json; then
            sed -i '/"expo-dev-client":/d' package.json
          fi
          pnpm exec expo prebuild --platform android --clean --no-install

          if [[ -f android/settings.gradle ]]; then
            sed -i "s#require.resolve('@react-native/gradle-plugin/package.json')#require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })#" android/settings.gradle || true
          fi

          if [[ -f android/gradle.properties ]]; then
            {
              echo ""
              echo "# CI overrides"
              echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"
              echo "org.gradle.parallel=true"
              echo "android.enableJetifier=false"
            } >> android/gradle.properties
          fi

          APP_GRADLE="android/app/build.gradle"
          if [[ -f "$APP_GRADLE" ]]; then
            sed -i 's|^[[:space:]]*//[[:space:]]*debuggableVariants.*|    debuggableVariants = []|' "$APP_GRADLE" || true
            if ! grep -q '^[[:space:]]*debuggableVariants' "$APP_GRADLE"; then
              awk '
                /react[[:space:]]*\{/ && !done {
                  print
                  print "    debuggableVariants = []"
                  done=1
                  next
                }
                { print }
              ' "$APP_GRADLE" > "$APP_GRADLE.tmp" && mv "$APP_GRADLE.tmp" "$APP_GRADLE"
            fi
          fi

          if [[ ! -f index.js ]]; then
            echo "::error::apps/mobile/index.js missing"
            exit 1
          fi

      - name: Prefetch SQLite amalgamation
        shell: bash
        run: |
          set -euo pipefail
          ZIP_URL="https://www.sqlite.org/2024/sqlite-amalgamation-3450300.zip"
          DEST="$RUNNER_TEMP/sqlite-amalgamation-3450300.zip"
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 5 --retry-delay 3 -o "$DEST" "$ZIP_URL"; then
              echo "SQLite zip OK (attempt $i)"
              break
            fi
            sleep 3
          done
          ls -la "$DEST" 2>/dev/null || echo "::warning::SQLite prefetch failed"

      - name: Build release APK (JS bundle embedded, debug-signed)
        working-directory: apps/mobile/android
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify bundle inside APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find apps/mobile/android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "APK=$APK"
          test -n "$APK"
          unzip -l "$APK" | tee "$RUNNER_TEMP/apk-list.txt" | grep -E 'index\.(android\.)?bundle|assets/index' \
            || { echo '::error::JS bundle not found inside APK'; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fitpulse-android-standalone-apk
          path: |
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
