name: Verify sync setup (E2E)

# Full cloud verification of the sync stack — no computer needed.
# Postgres service -> migrations -> secrets -> API up -> register users
# -> real HTTP checks over per-user JWTs:
#   /health reports jwt, register returns stable user_id + token,
#   push 401 without token, accepted with matching token, duplicate on
#   replay, 403 on user_id mismatch, cross-user pull isolation,
#   activity_credit projection (1 credit for terminal event, none for
#   intermediate, no double-credit on replay),
#   pr_observation from enriched projection.setLogs.
#   optimistic concurrency (expected_version): create at 0, stale →
#   version_conflict (not applied), retry with fresh version accepted.
# A summary table is written to the run's Summary page. On failure,
# diagnostics are committed to the ci-logs branch.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/db/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'fly.toml'
      - 'scripts/apply-db-migrations.sh'
      - 'scripts/start-api-container.sh'
      - '.github/workflows/verify-sync.yml'
  workflow_dispatch:

concurrency:
  group: verify-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    name: Postgres · Migrations · JWT · API E2E
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fitpulse
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Migrations 001-008
        run: |
          set -o pipefail
          ./scripts/apply-db-migrations.sh 2>&1 | tee migrate_all.log
          ./scripts/apply-db-migrations.sh 2>&1 | tee migrate_repeat.log
          test "$(psql "$DATABASE_URL" -X -Atc 'SELECT count(*) FROM public.forma_schema_migration')" = 8

      - name: RLS strict check
        run: |
          set -o pipefail
          STRICT=$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where c.relrowsecurity and c.relforcerowsecurity and n.nspname in ('platform','workout','engagement','nutrition');" 2>&1 | tee rls_check.log)
          echo "strict_tables=$STRICT"
          [ "$STRICT" -ge 11 ]

      - name: Generate secrets (pnpm sync:setup)
        run: |
          pnpm sync:setup
          test -s apps/api/.env
          grep -q '^SYNC_API_TOKEN=..' apps/api/.env
          grep -q '^JWT_SECRET=..' apps/api/.env
          grep -q '^EXPO_PUBLIC_SYNC_API_TOKEN=..' apps/mobile/.env
          echo "secrets OK"

      - name: Start API
        run: |
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/fitpulse"
          nohup pnpm --filter @forma/api start > api.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8787/health > /dev/null 2>&1; then echo "API is up"; break; fi
            sleep 1
          done
          curl -sf http://localhost:8787/health || { cat api.log; exit 1; }

      - name: /health reports jwt auth
        run: curl -s http://localhost:8787/health | grep '"auth":"jwt"'

      - name: nutrition cache is served from Postgres (seeded row)
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "INSERT INTO nutrition.product_cache (barcode, product, expires_at) VALUES ('4680036910028', jsonb_build_object('barcode','4680036910028','name','E2E cached product','source','open-food-facts'), now() + interval '1 hour') ON CONFLICT (barcode) DO NOTHING;"
          code=$(curl -s -o nutr.json -w '%{http_code}' http://localhost:8787/api/v1/nutrition/product/4680036910028)
          echo "status=$code"; cat nutr.json
          [ "$code" = "200" ]
          grep -q '"name":"E2E cached product"' nutr.json

      - name: register user A
        run: |
          curl -s -X POST http://localhost:8787/api/v1/auth/register \
            -H 'content-type: application/json' \
            -d '{"auth_subject":"alice@example.com"}' -o reg_a.json
          cat reg_a.json
          A_USER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('reg_a.json','utf8')).user_id)")
          A_TOKEN=$(node -e "console.log(JSON.parse(require('fs').readFileSync('reg_a.json','utf8')).token)")
          echo "A_USER=$A_USER"
          test -n "$A_USER" && test -n "$A_TOKEN"
          echo "A_USER=$A_USER" >> "$GITHUB_ENV"
          echo "A_TOKEN=$A_TOKEN" >> "$GITHUB_ENV"

      - name: register user B
        run: |
          curl -s -X POST http://localhost:8787/api/v1/auth/register \
            -H 'content-type: application/json' \
            -d '{"auth_subject":"bob@example.com"}' -o reg_b.json
          cat reg_b.json
          B_USER=$(node -e "console.log(JSON.parse(require('fs').readFileSync('reg_b.json','utf8')).user_id)")
          B_TOKEN=$(node -e "console.log(JSON.parse(require('fs').readFileSync('reg_b.json','utf8')).token)")
          echo "B_USER=$B_USER"
          test -n "$B_USER" && test -n "$B_TOKEN"
          echo "B_USER=$B_USER" >> "$GITHUB_ENV"
          echo "B_TOKEN=$B_TOKEN" >> "$GITHUB_ENV"

      - name: re-register A is idempotent (stable user_id)
        run: |
          curl -s -X POST http://localhost:8787/api/v1/auth/register \
            -H 'content-type: application/json' \
            -d '{"auth_subject":"alice@example.com"}' -o reg_a2.json
          A2=$(node -e "console.log(JSON.parse(require('fs').readFileSync('reg_a2.json','utf8')).user_id)")
          echo "A_USER=$A_USER A2=$A2"
          [ "$A_USER" = "$A2" ]

      - name: push without token is 401
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8787/api/v1/sync/push \
            -H 'content-type: application/json' -d '{}')
          echo "status=$code"
          [ "$code" = "401" ]

      - name: push with token but someone else user_id is 403
        run: |
          cat > mismatch.json <<EOF
          {"user_id":"$B_USER","operations":[]}
          EOF
          code=$(curl -s -o mismatch_resp.json -w '%{http_code}' -X POST http://localhost:8787/api/v1/sync/push \
            -H 'content-type: application/json' -H "authorization: Bearer $A_TOKEN" --data @mismatch.json)
          echo "status=$code"; cat mismatch_resp.json
          [ "$code" = "403" ]

      - name: push with token is 200 accepted (through strict RLS)
        run: |
          HASH=$(printf 'a%.0s' $(seq 1 64))
          cat > push.json <<EOF
          {"user_id":"$A_USER","operations":[{"client_operation_id":"018f0000-0000-7000-8000-000000000001","device_id":"00000000-0000-4000-8000-0000000000d1","aggregate_type":"workout_session","aggregate_id":"00000000-0000-4000-8000-0000000000a1","payload_hash":"$HASH","payload":{"event":"complete_set"},"occurred_at_client":"2026-09-29T00:00:00.000Z"}]}
          EOF
          code=$(curl -s -o resp.json -w '%{http_code}' -X POST http://localhost:8787/api/v1/sync/push \
            -H 'content-type: application/json' -H "authorization: Bearer $A_TOKEN" --data @push.json)
          echo "status=$code"; cat resp.json
          [ "$code" = "200" ]
          grep -q '"status":"accepted"' resp.json

      - name: replay of the same op is duplicate (idempotency E2E)
        run: |
          code=$(curl -s -o resp2.json -w '%{http_code}' -X POST http://localhost:8787/api/v1/sync/push \
            -H 'content-type: application/json' -H "authorization: Bearer $A_TOKEN" --data @push.json)
          echo "status=$code"; cat resp2.json
          [ "$code" = "200" ]
          grep -q '"status":"duplicate"' resp2.json

      - name: intermediate event grants no activity credit
        run: |
          CREDITS=$(psql "$DATABASE_URL" -Atc "select count(*) from engagement.activity_credit where user_id = '$A_USER'")
          echo "credits_after_intermediate=$CREDITS"
          [ "$CREDITS" = "0" ]

      - name: terminal session event grants exactly one activity credit
        run: |
          HASH=$(printf 'b%.0s' $(seq 1 64))
          cat > push_credit.json <<EOF
          {"user_id":"$A_USER","operations":[{"client_operation_id":"018f0000-0000-7000-8000-000000000002","device_id":"00000000-0000-4000-8000-0000000000d1","aggregate_type":"workout_session","aggregate_id":"00000000-0000-4000-8000-0000000000a2","payload_hash":"$HASH","payload":{"event":"complete_session","local_date":"2026-09-29"},"occurred_at_client":"2026-09-29T00:30:00.000Z"}]}
          EOF
          code=$(curl -s -o resp_credit.json -w '%{http_code}' -X POST http://localhost:8787/api/v1/sync/push \
            -H 'content-type: application/json' -H "authorization: Bearer $A_TOKEN" --data @push_credit.json)
          echo "status=$code"; cat resp_credit.json
          [ "$code" = "200" ]
          grep -q '"status":"accepted"' resp_credit.json

      - name: credit replay does not double-credit
        run: |
          code=$(curl -s -o resp_credit2.json -w '%{http_code}' -X POST http://localhost:8787/api/v1/sync/push \
            -H 'content-type: application/json' -H "authorization: Bearer $A_TOKEN" --data @push_credit.json)
          echo "status=$code"; cat resp_credit2.json
          [ "$code" = "200" ]
          grep -q '"status":"duplicate"' resp_credit2.json
          CREDITS=$(psql "$DATABASE_URL" -Atc "select count(*) from engagement.activity_credit where user_id = '$A_USER'" | tee credits_count.log)
          echo "credits_after_replay=$CREDITS"
          [ "$CREDITS" = "1" ]

      - name: soft PR observation from enriched setLogs
        run: |
          HASH=$(printf 'c%.0s' $(seq 1 64))
          cat > push_pr.json <<EOF
          {"user_id":"$A_USER","operations":[{"client_operation_id":"018f0000-0000-7000-8000-000000000003","device_id":"00000000-0000-4000-8000-0000000000d1","aggregate_type":"workout_session","aggregate_id":"00000000-0000-4000-8000-0000000000a3","payload_hash":"$HASH","payload":{"status":"completed","local_start_date":"2026-09-30","projection":{"setLogs":[{"exerciseId":1,"weight":90,"reps":5},{"exerciseId":7,"weight":40,"reps":10}]}},"occurred_at_client":"2026-09-30T10:00:00.000Z"}]}
          EOF
          code=$(curl -s -o resp_pr.json -w '%{http_code}' -X POST http://localhost:8787/api/v1/sync/push \
            -H 'content-type: application/json' -H "authorization: Bearer $A_TOKEN" --data @push_pr.json)
          echo "status=$code"; cat resp_pr.json
          [ "$code" = "200" ]
          grep -q '"status":"accepted"' resp_pr.json
          PRS=$(psql "$DATABASE_URL" -Atc "select count(*) from workout.pr_observation where user_id = '$A_USER'")
          echo "pr_observation_rows=$PRS"
          [ "$PRS" -ge 1 ]
          SESS=$(psql "$DATABASE_URL" -Atc "select count(*) from workout.workout_session where session_id = '00000000-0000-4000-8000-0000000000a3'")
          echo "materialized_session=$SESS"
          [ "$SESS" = "1" ]

      - name: pull as A returns accepted changes
        run: |
          curl -s "http://localhost:8787/api/v1/sync/pull?user_id=$A_USER&after_change_id=0" \
            -H "authorization: Bearer $A_TOKEN" -o pull.json
          cat pull.json
          CHANGES=$(node -e "console.log(JSON.parse(require('fs').readFileSync('pull.json','utf8')).changes.length)")
          echo "changes=$CHANGES"
          [ "$CHANGES" -ge 2 ]

      - name: pull as B sees nothing (cross-user isolation)
        run: |
          curl -s "http://localhost:8787/api/v1/sync/pull?user_id=$B_USER&after_change_id=0" \
            -H "authorization: Bearer $B_TOKEN" -o pull_b.json
          cat pull_b.json
          CHANGES=$(node -e "console.log(JSON.parse(require('fs').readFileSync('pull_b.json','utf8')).changes.length)")
          echo "changes_b=$CHANGES"
          [ "$CHANGES" = "0" ]

      - name: pull as B with A user_id is 403
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8787/api/v1/sync/pull?user_id=$A_USER&after_change_id=0" \
            -H "authorization: Bearer $B_TOKEN")
          echo "status=$code"
          [ "$code" = "403" ]

      - name: "OC: expected_version 0 creates at version 1"
        run: |
          HASH=$(printf 'd%.0s' $(seq 1 64))
          cat > push_oc1.json <<EOF
          {"user_id":"$A_USER","operations":[{"client_operation_id":"018f0000-0000-7000-8000-000000000011","device_id":"00000000-0000-4000-8000-0000000000d1","aggregate_type":"note","aggregate_id":"00000000-0000-4000-8000-0000000000b1","payload_hash":"$HASH","payload":{"text":"oc-create"},"expected_version":0,"occurred_at_client":"2026-09-30T11:00:00.000Z"}]}
          EOF
          code=$(curl -s -o oc1.json -w '%{http_code}' -X POST http://localhost:8787/api/v1/sync/push \
            -H 'content-type: application/json' -H "authorization: Bearer $A_TOKEN" --data @push_oc1.json)
          echo "status=$code"; cat oc1.json
          [ "$code" = "200" ]
          grep -q '"status":"accepted"' oc1.json
          grep -q '"entity_version":1' oc1.json

      - name: "OC: stale expected_version is version_conflict (not applied)"
        run: |
          HASH=$(printf 'e%.0s' $(seq 1 64))
          cat > push_oc2.json <<EOF
          {"user_id":"$A_USER","operations":[{"client_operation_id":"018f0000-0000-7000-8000-000000000012","device_id":"00000000-0000-4000-8000-0000000000d1","aggregate_type":"note","aggregate_id":"00000000-0000-4000-8000-0000000000b1","payload_hash":"$HASH","payload":{"text":"oc-conflict"},"expected_version":0,"occurred_at_client":"2026-09-30T11:01:00.000Z"}]}
          EOF
          code=$(curl -s -o oc2.json -w '%{http_code}' -X POST http://localhost:8787/api/v1/sync/push \
            -H 'content-type: application/json' -H "authorization: Bearer $A_TOKEN" --data @push_oc2.json)
          echo "status=$code"; cat oc2.json
          [ "$code" = "200" ]
          grep -q '"error_code":"version_conflict"' oc2.json
          grep -q '"current_version":1' oc2.json
          CHANGES=$(psql "$DATABASE_URL" -Atc "select count(*) from platform.sync_change where user_id = '$A_USER' and entity_id = '00000000-0000-4000-8000-0000000000b1'")
          echo "b1_changes_after_conflict=$CHANGES"
          [ "$CHANGES" = "1" ]

      - name: "OC: conflict not persisted — same op retried with fresh version accepted"
        run: |
          HASH=$(printf 'e%.0s' $(seq 1 64))
          cat > push_oc3.json <<EOF
          {"user_id":"$A_USER","operations":[{"client_operation_id":"018f0000-0000-7000-8000-000000000012","device_id":"00000000-0000-4000-8000-0000000000d1","aggregate_type":"note","aggregate_id":"00000000-0000-4000-8000-0000000000b1","payload_hash":"$HASH","payload":{"text":"oc-conflict"},"expected_version":1,"occurred_at_client":"2026-09-30T11:01:00.000Z"}]}
          EOF
          code=$(curl -s -o oc3.json -w '%{http_code}' -X POST http://localhost:8787/api/v1/sync/push \
            -H 'content-type: application/json' -H "authorization: Bearer $A_TOKEN" --data @push_oc3.json)
          echo "status=$code"; cat oc3.json
          [ "$code" = "200" ]
          grep -q '"status":"accepted"' oc3.json
          grep -q '"entity_version":2' oc3.json
          HEAD=$(psql "$DATABASE_URL" -Atc "select current_version from platform.entity_head where user_id = '$A_USER' and entity_id = '00000000-0000-4000-8000-0000000000b1'")
          echo "entity_head=$HEAD"
          [ "$HEAD" = "2" ]

      - name: "OC: no expected_version keeps last-write-wins"
        run: |
          HASH=$(printf 'f%.0s' $(seq 1 64))
          cat > push_oc4.json <<EOF
          {"user_id":"$A_USER","operations":[{"client_operation_id":"018f0000-0000-7000-8000-000000000013","device_id":"00000000-0000-4000-8000-0000000000d1","aggregate_type":"note","aggregate_id":"00000000-0000-4000-8000-0000000000b1","payload_hash":"$HASH","payload":{"text":"oc-lww"},"occurred_at_client":"2026-09-30T11:02:00.000Z"}]}
          EOF
          code=$(curl -s -o oc4.json -w '%{http_code}' -X POST http://localhost:8787/api/v1/sync/push \
            -H 'content-type: application/json' -H "authorization: Bearer $A_TOKEN" --data @push_oc4.json)
          echo "status=$code"; cat oc4.json
          [ "$code" = "200" ]
          grep -q '"status":"accepted"' oc4.json
          grep -q '"entity_version":3' oc4.json

      - name: Write run summary
        if: always()
        run: |
          {
            echo "## Sync E2E (JWT) — результат"
            echo ""
            echo "| Проверка | Результат |"
            echo "|---|---|"
            echo "| Миграции 001–008 | ${{ job.status }} |"
            echo "| Строгий RLS (FORCE) | $(cat rls_check.log 2>/dev/null || echo n/a) таблиц |"
            echo "| Nutrition-кэш из Postgres | $(grep -o '"name":"[^"]*"' nutr.json 2>/dev/null || echo fail) |"
            echo "| регистрация A/B | стабильные user_id |"
            echo "| push без токена | 401 |"
            echo "| push с чужим user_id | 403 |"
            echo "| push с токеном A | $(grep -o '"status":"[a-z]*"' resp.json 2>/dev/null || echo fail) |"
            echo "| повтор (идемпотентность) | $(grep -o '"status":"[a-z]*"' resp2.json 2>/dev/null || echo fail) |"
            echo "| кредит за терминальное событие | $(cat credits_count.log 2>/dev/null || echo fail) строка(и) |"
            echo "| soft PR / materialize | $(cat resp_pr.json 2>/dev/null | head -c 80 || echo n/a) |"
            echo "| pull A / pull B | $(node -e "try{console.log(JSON.parse(require('fs').readFileSync('pull.json','utf8')).changes.length)}catch{console.log('fail')}" 2>/dev/null) / $(node -e "try{console.log(JSON.parse(require('fs').readFileSync('pull_b.json','utf8')).changes.length)}catch{console.log('fail')}" 2>/dev/null) changes |"
            echo "| OC expected_version | $(grep -o '"entity_version":[0-9]*' oc4.json 2>/dev/null || echo fail) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish diagnostics on failure
        # Ревью #9: в ветку ci-logs пишем только из same-repo ранов —
        # у fork-PR токен read-only: шаг молча падал и краснил CI контрибьютору.
        if: failure() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch origin ci-logs
          git checkout -B ci-logs origin/ci-logs 2>/dev/null || git checkout -B ci-logs
          DIR="ci-logs/${{ github.run_id }}"
          mkdir -p "$DIR"
          for f in migrate_*.log rls_check.log api.log reg_*.json mismatch*.json push*.json resp*.json pull*.json oc*.json credits_count.log nutr.json; do
            [ -f "$f" ] && cp "$f" "$DIR/"
          done
          echo "failed run: ${{ github.run_id }} commit ${{ github.sha }} date $(date -u +%FT%TZ)" >> "$DIR/README.txt"
          git add -f ci-logs
          git commit -m "ci: diagnostics from failed run ${{ github.run_id }}"
          git push --force origin ci-logs
          exit 0
