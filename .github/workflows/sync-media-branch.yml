name: Sync exercise media PR with main

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-media-branch.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main into feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout feat/dataset-instructions-local-media
          git merge --no-edit origin/main
          git push origin feat/dataset-instructions-local-media
